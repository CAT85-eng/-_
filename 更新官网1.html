<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>时脚本 · 官方网站</title>
    <meta name="description" content="时脚本 - 轻量高效的游戏辅助脚本，无需复杂配置，即刻开始使用。">
    <meta name="theme-color" content="#f7f7f9">
    <style>
        /* ============================================================
           时脚本官方网站 - 全量样式表
           版本: 12.0.0 - LIQUID GLASS ULTRA
           设计语言: iOS 26 液态玻璃 / 高斯模糊 / 外星级阻尼弹性
           适配: 移动端优先 / 桌面端完整布局 / 零帧丢失
           彩蛋系统: 连续点击Logo五次触发全屏特效
           ============================================================ */

        :root {
            /* 基础色板 */
            --bg: #f7f7f9;
            --bg-deep: #f0f0f4;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-hover: rgba(255, 255, 255, 0.88);
            --surface-solid: #ffffff;
            --surface-muted: rgba(255, 255, 255, 0.45);

            /* 文字色阶 */
            --text: #16161a;
            --text-secondary: #5a5a6e;
            --text-tertiary: #8e8e9f;
            --text-quaternary: #b8b8c4;
            --text-invert: #ffffff;

            /* 边框体系 */
            --border: rgba(0, 0, 0, 0.05);
            --border-medium: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.12);
            --border-glass: rgba(255, 255, 255, 0.85);

            /* 强调色 */
            --accent: #16161a;
            --accent-secondary: #2d2d3a;
            --accent-soft: rgba(22, 22, 26, 0.06);
            --accent-softer: rgba(22, 22, 26, 0.03);

            /* 彩蛋色 */
            --egg-gold: #d4a72c;
            --egg-purple: #7c3aed;
            --egg-pink: #ec4899;
            --egg-cyan: #06b6d4;

            /* 圆角体系 */
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --radius-full: 50px;

            /* 模糊与阴影 */
            --glass-blur: 24px;
            --glass-blur-light: 16px;
            --shadow-soft: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-medium: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-large: 0 16px 48px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 24px 64px rgba(0, 0, 0, 0.1);
            --shadow-glass: 0 4px 20px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.9);

            /* 外星级动画曲线 - 极致阻尼弹性体系 */
            --spring-soft: cubic-bezier(0.22, 1, 0.36, 1);
            --spring-medium: cubic-bezier(0.34, 1.56, 0.64, 1);
            --spring-heavy: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            --damping: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-smooth: cubic-bezier(0.4, 0, 0.2, 1);

            /* 过渡时长 */
            --duration-fast: 0.15s;
            --duration-normal: 0.3s;
            --duration-slow: 0.5s;
            --duration-slower: 0.7s;
            --duration-epic: 0.9s;
        }

        /* ============ 重置样式 ============ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            animation: pageLoad 0.8s var(--ease-out-expo) both;
        }

        @keyframes pageLoad {
            0% {
                opacity: 0;
                transform: scale(0.98);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ============ 导航栏 - 液态玻璃 ============ */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 52px;
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: calc(100% - 32px);
            max-width: 480px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.04),
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 -1px 0 rgba(255, 255, 255, 0.3) inset;
            transition: 
                box-shadow 0.6s var(--damping),
                background 0.4s var(--spring-soft),
                transform 0.6s var(--damping);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-font-smoothing: subpixel-antialiased;
        }

        .nav:hover {
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.06),
                0 1px 0 rgba(255, 255, 255, 0.95) inset,
                0 -1px 0 rgba(255, 255, 255, 0.3) inset;
        }

        .nav-brand {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.5s var(--spring-medium);
            will-change: transform;
            backface-visibility: hidden;
        }

        .nav-brand:active {
            transform: scale(0.92);
            transition: transform 0.12s var(--spring-soft);
        }

        .nav-brand .brand-logo {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            display: inline-block;
            pointer-events: none;
            transition: 
                transform 0.6s var(--spring-heavy),
                opacity 0.3s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .nav-brand:active .brand-logo {
            transform: scale(0.82);
            transition: transform 0.1s var(--spring-soft);
        }

        /* 汉堡菜单按钮 */
        .nav-toggle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: 
                transform 0.5s var(--spring-medium),
                background 0.3s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .nav-toggle:active {
            transform: scale(0.85);
            transition: transform 0.1s var(--spring-soft);
            background: rgba(22, 22, 26, 0.08);
        }

        .nav-toggle span {
            width: 16px;
            height: 1.5px;
            background: var(--text);
            border-radius: 50px;
            transition: 
                transform 0.5s var(--spring-heavy),
                opacity 0.3s var(--spring-soft),
                width 0.3s var(--spring-soft);
            will-change: transform;
        }

        .nav-toggle.active span:nth-child(1) {
            transform: translateY(5.5px) rotate(45deg);
            width: 18px;
        }

        .nav-toggle.active span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }

        .nav-toggle.active span:nth-child(3) {
            transform: translateY(-5.5px) rotate(-45deg);
            width: 18px;
        }

        /* ============ 下拉菜单 - iOS 26 液态玻璃 ============ */
        .nav-menu {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%) translateY(-24px) translateZ(0);
            width: calc(100% - 32px);
            max-width: 480px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: var(--radius-lg);
            padding: 8px;
            box-shadow: 
                0 16px 48px rgba(0, 0, 0, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.98) inset,
                0 -1px 0 rgba(255, 255, 255, 0.4) inset,
                0 0 40px rgba(255, 255, 255, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: 
                opacity 0.5s var(--spring-soft),
                transform 0.7s var(--spring-medium),
                box-shadow 0.5s var(--damping);
            will-change: transform, opacity;
            backface-visibility: hidden;
            z-index: 998;
            overflow: hidden;
        }

        /* 液态玻璃边缘光晕 */
        .nav-menu::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                ellipse at 30% 20%,
                rgba(255, 255, 255, 0.6) 0%,
                transparent 40%
            );
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.5s var(--spring-soft);
        }

        .nav-menu::after {
            content: '';
            position: absolute;
            bottom: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(
                ellipse at 70% 80%,
                rgba(255, 255, 255, 0.4) 0%,
                transparent 40%
            );
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            transition: opacity 0.5s var(--spring-soft);
        }

        .nav-menu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0) translateZ(0);
            box-shadow: 
                0 24px 64px rgba(0, 0, 0, 0.1),
                0 1px 0 rgba(255, 255, 255, 0.98) inset,
                0 -1px 0 rgba(255, 255, 255, 0.4) inset,
                0 0 60px rgba(255, 255, 255, 0.4);
        }

        .nav-menu a {
            display: block;
            padding: 13px 18px;
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            position: relative;
            z-index: 1;
            transition: 
                background 0.35s var(--spring-soft),
                color 0.35s var(--spring-soft),
                transform 0.5s var(--spring-medium);
            will-change: transform;
            backface-visibility: hidden;
        }

        .nav-menu a:hover {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text);
            transform: translateX(2px);
        }

        .nav-menu a:active {
            transform: scale(0.95);
            transition: transform 0.1s var(--spring-soft);
            background: rgba(22, 22, 26, 0.06);
        }

        .nav-menu .menu-divider {
            height: 1px;
            background: rgba(0, 0, 0, 0.04);
            margin: 4px 8px;
            position: relative;
            z-index: 1;
        }

        /* ============ 主内容 ============ */
        main {
            padding-top: 72px;
            max-width: 480px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        /* ============ Hero 区域 ============ */
        .hero {
            text-align: center;
            padding: 40px 4px 50px;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -30%;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: 500px;
            height: 500px;
            background: radial-gradient(
                ellipse at center,
                rgba(22, 22, 26, 0.05) 0%,
                rgba(22, 22, 26, 0.02) 35%,
                transparent 70%
            );
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
            will-change: transform;
        }

        .hero-tag {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            color: var(--text-secondary);
            font-size: 0.78rem;
            font-weight: 500;
            margin-bottom: 20px;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            transition: 
                transform 0.5s var(--spring-medium),
                background 0.3s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .hero-tag:active {
            transform: scale(0.92);
            transition: transform 0.1s var(--spring-soft);
        }

        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.15;
            margin-bottom: 16px;
            animation: heroTitleIn 1.2s var(--spring-heavy) both;
            will-change: transform;
        }

        @keyframes heroTitleIn {
            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.92);
            }
            50% {
                opacity: 1;
                transform: translateY(-8px) scale(1.02);
            }
            70% {
                transform: translateY(3px) scale(0.99);
            }
            85% {
                transform: translateY(-2px) scale(1.005);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 320px;
            margin: 0 auto 28px;
            animation: heroFadeIn 1.2s var(--damping) 0.15s both;
        }

        @keyframes heroFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            animation: heroFadeIn 1.2s var(--damping) 0.3s both;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 
                transform 0.6s var(--spring-medium),
                box-shadow 0.6s var(--spring-medium),
                background 0.4s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
        }

        .btn-primary:active {
            transform: scale(0.9);
            transition: transform 0.1s var(--spring-soft);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-soft);
        }

        .btn-secondary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: var(--shadow-medium);
            background: rgba(255, 255, 255, 0.8);
        }

        .btn-secondary:active {
            transform: scale(0.9);
            transition: transform 0.1s var(--spring-soft);
        }

        /* ============ 功能卡片 ============ */
        .features {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px 0 40px;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-xl);
            padding: 24px 20px;
            box-shadow: 
                var(--shadow-soft),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            transition: 
                transform 0.7s var(--spring-medium),
                box-shadow 0.7s var(--spring-medium),
                background 0.5s var(--spring-soft);
            cursor: default;
            will-change: transform;
            backface-visibility: hidden;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .feature-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 
                var(--shadow-large),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            background: rgba(255, 255, 255, 0.75);
        }

        .feature-card:active {
            transform: scale(0.96);
            transition: transform 0.15s var(--spring-soft);
        }

        .feature-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: 
                transform 0.6s var(--spring-heavy),
                background 0.4s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .feature-card:hover .feature-icon {
            transform: scale(1.08) rotate(-3deg);
            background: rgba(255, 255, 255, 0.85);
        }

        .feature-card:active .feature-icon {
            transform: scale(0.88);
            transition: transform 0.12s var(--spring-soft);
        }

        .feature-icon svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feature-text h3 {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .feature-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ============ 团队区域 ============ */
        .team-section {
            padding: 20px 0 40px;
            text-align: center;
        }

        .team-section h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 20px;
        }

        .team-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .team-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: 
                var(--shadow-soft),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            transition: 
                transform 0.7s var(--spring-medium),
                box-shadow 0.7s var(--spring-medium);
            cursor: default;
            will-change: transform;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }

        .team-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 
                var(--shadow-large),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        .team-card:active {
            transform: scale(0.96);
            transition: transform 0.15s var(--spring-soft);
        }

        .team-card img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: 
                transform 0.6s var(--spring-heavy),
                border-color 0.3s var(--spring-soft),
                box-shadow 0.5s var(--spring-soft);
            will-change: transform;
            backface-visibility: hidden;
        }

        .team-card:hover img {
            transform: scale(1.06);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .team-card:active img {
            transform: scale(0.9);
            transition: transform 0.12s var(--spring-soft);
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
        }

        .team-name img {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0;
            border: none;
            box-shadow: none;
            flex-shrink: 0;
        }

        .team-role {
            font-size: 0.78rem;
            color: var(--text-tertiary);
        }

        /* ============ 代码链接区域 ============ */
        .code-section {
            text-align: center;
            padding: 20px 0 50px;
            position: relative;
        }

        .code-section::before {
            content: '';
            position: absolute;
            top: -20%;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            width: 400px;
            height: 400px;
            background: radial-gradient(
                ellipse at center,
                rgba(22, 22, 26, 0.04) 0%,
                transparent 65%
            );
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
            will-change: transform;
        }

        .code-section h2 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            margin-bottom: 8px;
        }

        .code-section > p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .code-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-xl);
            padding: 20px;
            box-shadow: 
                var(--shadow-medium),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            transition: 
                transform 0.7s var(--spring-medium),
                box-shadow 0.7s var(--spring-medium);
            will-change: transform;
            backface-visibility: hidden;
        }

        .code-card:hover {
            transform: translateY(-4px);
            box-shadow: 
                var(--shadow-large),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
        }

        .code-card:active {
            transform: scale(0.97);
            transition: transform 0.15s var(--spring-soft);
        }

        .code-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            transition: 
                transform 0.5s var(--spring-medium),
                padding 0.3s var(--spring-soft);
            cursor: pointer;
            will-change: transform;
            backface-visibility: hidden;
        }

        .code-item:hover {
            transform: translateX(3px);
        }

        .code-item:active {
            transform: scale(0.96);
            transition: transform 0.12s var(--spring-soft);
        }

        .code-info h4 {
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: -0.2px;

        }

            padding: 7px 16px;

            font-weight: 600;

            text-decoration: none;

                background 0.3s var(--spring-soft),
                color 0.3s var(--spring-soft),
                box-shadow 0.4s var(--spring-soft);
            flex-shrink: 0;
            will-change: transform;
            backface-visibility: hidden;
        }

        .btn-code:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .btn-code:active {
            transform: scale(0.88);
            transition: transform 0.1s var(--spring-soft);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        /* ============ 页脚 ============ */
        .footer {
            text-align: center;
            padding: 24px 16px;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            color: var(--text-tertiary);
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
        }

        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: 
                color 0.3s var(--spring-soft),
                transform 0.5s var(--spring-medium);
            display: inline-block;
            will-change: transform;
            backface-visibility: hidden;
        }

        .footer a:hover {
            color: var(--text);
            transform: translateY(-1px);
        }

        .footer a:active {
            transform: scale(0.9);
            transition: transform 0.1s var(--spring-soft);
        }

        /* ============ 彩蛋特效层 ============ */
        .easter-egg-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s var(--spring-soft);
        }

        .easter-egg-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .easter-egg-particle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: particleBurst 1.4s var(--spring-heavy) forwards;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        @keyframes particleBurst {
            0% {
                transform: translate(0, 0) scale(1) translateZ(0);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0) translateZ(0);
                opacity: 0;
            }
        }

        .easter-egg-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) translateZ(0);
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--text);
            animation: eggTextPop 1.2s var(--spring-heavy) forwards;
            will-change: transform, opacity;
            backface-visibility: hidden;
        }

        @keyframes eggTextPop {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-10deg) translateZ(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.4) rotate(3deg) translateZ(0);
                opacity: 1;
            }
            70% {
                transform: translate(-50%, -50%) scale(0.92) rotate(-1deg) translateZ(0);
            }
            85% {
                transform: translate(-50%, -50%) scale(1.03) rotate(0.5deg) translateZ(0);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg) translateZ(0);
                opacity: 1;
            }
        }

    <script>
        (function() {
            const navToggle = document.getElementById('navToggle');
            const navMenu = document.getElementById('navMenu');

            navToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                navToggle.classList.toggle('active');
                navMenu.classList.toggle('open');
            });

            navMenu.querySelectorAll('a').forEach(function(link) {
                link.addEventListener('click', function() {
                    navToggle.classList.remove('active');
                    navMenu.classList.remove('open');
                });
            });

            document.addEventListener('click', function(e) {
                if (!navMenu.contains(e.target) && !navToggle.contains(e.target)) {
                    navToggle.classList.remove('active');
                    navMenu.classList.remove('open');
                }
            });

            const brandLogo = document.getElementById('brandLogo');
            const easterEggOverlay = document.getElementById('easterEggOverlay');
            let clickCount = 0;
            let clickTimer = null;
            let eggTriggered = false;

            brandLogo.addEventListener('click', function(e) {
                e.preventDefault();
                if (eggTriggered) return;
                clickCount++;
                clearTimeout(clickTimer);
                clickTimer = setTimeout(function() {
                    clickCount = 0;
                }, 800);
                if (clickCount >= 5) {
                    eggTriggered = true;
                    clickCount = 0;
                    triggerEasterEgg();
                }
            });

            function triggerEasterEgg() {
                const overlay = easterEggOverlay;
                const colors = ['#d4a72c', '#7c3aed', '#ec4899', '#06b6d4', '#16161a', '#5a5a6e'];
                for (let i = 0; i < 50; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'easter-egg-particle';
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 120 + Math.random() * 300;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particle.style.cssText = 'left:50%;top:50%;background:' + color + ';width:' + (6 + Math.random() * 12) + 'px;height:' + (6 + Math.random() * 12) + 'px;--tx:' + tx + 'px;--ty:' + ty + 'px;animation-delay:' + (Math.random() * 0.25) + 's;';
                    overlay.appendChild(particle);
                }
                const text = document.createElement('div');
                text.className = 'easter-egg-text';
                text.textContent = '时脚本';
                overlay.appendChild(text);
                overlay.classList.add('active');
                setTimeout(function() {
                    overlay.classList.remove('active');
                    setTimeout(function() {
                        overlay.innerHTML = '';
                        eggTriggered = false;
                    }, 400);
                }, 2000);
            }
        })();
    </script>
